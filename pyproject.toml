[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-manager"
version = "0.9.0"
description = "Online shop management system with profiling and parallel optimization (Lab 09, variant 3)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
shop-manager = "shop_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
